{% extends 'base.html' %}

{% block title %}Register{% endblock %}
{% block css %}
<link rel='stylesheet' href='../static/css/register.css'>
{% endblock %}

{% block content %}
<div class="card shadow mx-auto" id="register-card">
    <div class="card-body">
        <h1 class="text-center mb-4" id="register-title">Register</h1>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Enter the name</label>
                <input type="text" name="name" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Enter the mail</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Enter the pin</label>
                <input type="password" name="pin" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm the pin</label>
                <input type="password" name="cpin" class="form-control">
            </div>
            <input type="submit" value="Register" class="btn w-100" id="register-btn">
        </form>

        <p class="text-center mt-3">Already have account? <a href="/login">Login</a></p>

        {% if info %}
        <div class="alert alert-info text-center mt-3">{{info}}</div>
        {% endif %}
    </div>
</div>
{% endblock %}
