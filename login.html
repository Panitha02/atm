{% extends 'base.html' %}

{% block title %}Login Page{% endblock %}
{% block css %}
<link rel='stylesheet' href='../static/css/login.css'>
{% endblock %}

{% block content %}
<div class="card shadow mx-auto" id="login-card">
    <div class="card-body">
        <h1 class="text-center mb-4" id="login-title">Login Page</h1>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Enter the mail</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Enter the pin</label>
                <input type="password" name="pin" class="form-control">
            </div>
            <input type="submit" value="Login" class="btn w-100" id="login-btn">
        </form>

        <p class="text-center mt-3 mb-1">Forgot pin? <a href="/forgotpin">click here</a></p>
        <p class="text-center">New User? <a href="/register">Register</a></p>

        {% if info %}
        <div class="alert alert-info text-center mt-3">{{info}}</div>
        {% endif %}
    </div>
</div>
{% endblock %}
